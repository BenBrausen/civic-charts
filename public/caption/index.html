<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Copy caption | Civic Charts</title>
<style>
  :root { --bg: #f6f5f1; --fg: #1b1b1b; --muted: #5c5c5c; --box: #fff; --line: #ddd9cf; --accent: #2f6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #a8a8a8; --box: #222; --line: #3a3a3a; --accent: #6ea0ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); }
  textarea { width: 100%; box-sizing: border-box; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--box); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  button { width: 100%; margin-top: 12px; padding: 14px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 17px; }
</style>
</head>
<body>
<main>
  <h1 id="h">Copy caption</h1>
  <p id="msg">Tap Copy, then open the draft in TikTok and paste it into the description.</p>
  <textarea id="t" aria-label="Caption"></textarea>
  <button id="copy" type="button">Copy caption</button>
</main>
<script>
  // The caption travels in the #fragment, which browsers never send to the server.
  const t = document.getElementById('t'), btn = document.getElementById('copy');
  let text = '';
  try { text = decodeURIComponent(location.hash.slice(1)); } catch { text = ''; }
  const net = new URLSearchParams(location.search).get('for');
  if (net) document.getElementById('h').textContent = 'Copy ' + net + ' caption';
  if (!text) { document.getElementById('msg').textContent = 'No caption in this link. Open it from the posting results on GitHub.'; btn.hidden = true; t.hidden = true; }
  t.value = text;
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(t.value); }
    catch { t.focus(); t.select(); document.execCommand('copy'); }
    btn.textContent = 'Copied. Now paste it in the TikTok draft';
  };
</script>
</body>
</html>
